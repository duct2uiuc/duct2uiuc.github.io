<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topic Shifts Trend</title>
    <link rel="stylesheet" href="styles.css">
    <script src='https://d3js.org/d3.v7.min.js'></script>
    <script src='app.js'></script>
</head>
<body>
<main>
    <p class="subtext">2020 – 2026 | Popular topics</p>
    <h1>Evolution of Topic Rankings in Awarded Projects</h1>
    <p class="subheading"> Explore how project objectives (topics) change in prominence over time</p>
    <button id="tour-start" class="quick-tour"  type="button" disabled>Quick tour</button>

    <div class="navigations">
        <button id="previous-button" type="button">🡰 Previous year</button>
        <span id="current-year" aria-live="polite"></span>
        <button id="next-button" type="button">Next year 🡲</button>
    </div>

    <div id="svg"></div>
</main>

<div class="tooltip"></div>
<div class="tour-overlay" id="tour-overlay" hidden></div>
<section id="tour-dialog" class="tour-dialog" aria-modal="true" aria-labelledby="tour-heading" role="dialog" hidden>
    <p id="tour-page" class="tour-page" ></p>
    <h2 id="tour-heading"></h2>
    <p id="tour-description"></p>
    <button id="tour-button" type="button"></button>
</section>
</body>
</html>
