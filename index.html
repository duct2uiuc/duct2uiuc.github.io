<!DOCTYPE html>
<html>
    
<head>
    <title>My Website</title>
</head>

<body>
    <h1>Hello World!</h1>
    <script src='https://d3js.org/d3.v5.min.js'></script>
    <svg width=300 height=300></svg>
    
    <script>
        const data = await d3.csv("https://flunky.github.io/cars2017.csv", d=> ({
        AverageCityMPG: Number(d.AverageCityMPG),
        AverageHighwayMPG: Number(d.AverageHighwayMPG),
        EngineCylinders: Number(d.EngineCylinders)
        }));
        
        
        var x = d3.scaleLog().base(10).domain([10,150]).range([0, 200]);
        var y = d3.scaleLog().base(10).domain([10,150]).range([200, 0]);
        
        d3.select("svg")
        .append("g")
        .attr("transform","translate(50,50)");
        
        
        d3.select("svg")
        .selectAll("circle")
        .data(data)
        .join("circle")
          .attr("cx", function(d) {return x(d.AverageCityMPG);})
          .attr("cy",function(d) {return y(d.AverageHighwayMPG);})
          .attr("r", function(d) {return d.EngineCylinders+2;});
        
        d3.select("svg")
        .append("g")
        .attr("transform","translate(50,50)")
        .call(d3.axisLeft(y)
          .tickValues([10, 20, 50, 100])
          .tickFormat(d3.format("~s")))
        
        d3.select("svg")
        .append("g")
        .attr("transform","translate(50,250)")
        .call(d3.axisBottom(x)
          .tickValues([10, 20, 50, 100])
          .tickFormat(d3.format("~s")));

    </script>
</body>
</html>
